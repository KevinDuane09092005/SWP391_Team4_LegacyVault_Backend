server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 1
      idle-timeout: 120000
      max-lifetime: 300000
      connection-timeout: 20000
      keepalive-time: 60000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}

face-verification:
  encryption-key: ${FACE_ENCRYPTION_KEY}
  liveness-threshold: ${FACE_LIVENESS_THRESHOLD:0.35}
  anti-spoof-threshold: ${FACE_ANTI_SPOOF_THRESHOLD:0.35}
  face-match-threshold: ${FACE_MATCH_THRESHOLD:0.5}

storage:
  local:
    base-dir: ${STORAGE_LOCAL_BASE_DIR:/tmp/legacyvault-uploads}

app:
  backend-url: ${APP_BACKEND_URL}
  frontend-url: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

legacyvault:
  chatbot:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-6-luna}
      timeout: ${OPENAI_TIMEOUT:20s}
