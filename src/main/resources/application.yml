spring:
  application:
    name: LegacyVault
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/legacy_vault_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  quartz:
    job-store-type: memory

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 1 day in ms

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    full-name: ${ADMIN_BOOTSTRAP_FULL_NAME:LegacyVault Admin}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

dms:
  scheduler:
    cron: "0 * * ? * *" # Cú pháp Quartz Cron: chạy tự động mỗi 1 phút 1 lần (tại giây thứ 0 của mỗi phút)
