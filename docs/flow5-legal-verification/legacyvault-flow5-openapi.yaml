openapi: 3.0.3
info:
  title: LegacyVault Flow 5 - Legal Verification API
  description: >
    API for submitting and reviewing evidence for a triggered handover and a
    specific asset assignment and beneficiary. Approval is only an input to Flow 6; it does not
    decrypt assets or determine legal inheritance rights.
  version: 0.2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Legal Verification
    description: Executor submissions and Legal Verifier review workflow

paths:
  /legal-verification-cases:
    get:
      tags: [Legal Verification]
      summary: List cases visible to the authenticated user
      description: >
        Executors see only cases they submitted. Legal Verifiers see summaries of
        unassigned SUBMITTED cases and cases assigned to themselves. Full case
        details are available to the executor who owns the case and its assigned
        reviewer. Only that reviewer can record a decision.
      operationId: listLegalVerificationCases
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Cases returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Legal Verification]
      summary: Create a draft verification case
      description: >
        The authenticated user must match the executor contact assigned to
        the selected asset assignment. The handover must already exist and
        its DMS must be triggered. The beneficiary must belong to the same
        owner and be linked to that assignment. Executor and reviewer user IDs
        are resolved from the authenticated principal, never from this request.
        Creating the case does not unlock or decrypt any asset.
      operationId: createLegalVerificationCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Draft case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Legal Verification]
      summary: Get a verification case
      description: Returns case details and document metadata, never file-storage keys or public file URLs.
      operationId: getLegalVerificationCase
      responses:
        '200':
          description: Case returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}/documents:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Legal Verification]
      summary: List case document metadata
      operationId: listLegalVerificationDocuments
      responses:
        '200':
          description: Document metadata returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Legal Verification]
      summary: Upload evidence to a case
      description: >
        Executor only, while the case is DRAFT or NEEDS_INFORMATION. Accept
        PDF, JPEG, or PNG files up to 10 MB each as a prototype default.
        Validate the actual file type and size on the server. Store bytes in
        private encrypted storage; keep only metadata and a private storage
        key in MySQL. A file digest supports integrity checking, not proof of
        legal authenticity.
      operationId: uploadLegalVerificationDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '201':
          description: Document stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/IntegrationUnavailable'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}/documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Legal Verification]
      summary: Read an authorized case document
      description: >
        Streams the document only after checking that the authenticated user
        is the executor who owns the case or its assigned Legal Verifier. Do
        not return a permanent or public object-storage URL.
      operationId: readLegalVerificationDocument
      responses:
        '200':
          description: Document content
          headers:
            Content-Disposition:
              description: Sanitized attachment filename
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/IntegrationUnavailable'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}/submit:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Legal Verification]
      summary: Submit or resubmit a verification case
      description: >
        Executor only. Allowed from DRAFT or NEEDS_INFORMATION. Submission
        requires a DEATH_CERTIFICATE document. Other supporting documents are
        optional and depend on the circumstances.
      operationId: submitLegalVerificationCase
      responses:
        '200':
          description: Case submitted to the review queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}/start-review:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Legal Verification]
      summary: Assign the case to the authenticated Legal Verifier
      description: Legal Verifier only. The reviewer identity comes from the authenticated principal.
      operationId: startLegalVerificationReview
      responses:
        '200':
          description: Review started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}/request-information:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Legal Verification]
      summary: Request more information from the executor
      description: Legal Verifier assigned to the case only. The reason is recorded in case history.
      operationId: requestLegalVerificationInformation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInformationRequest'
      responses:
        '200':
          description: Case moved to NEEDS_INFORMATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}/decision:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Legal Verification]
      summary: Approve or reject a reviewed case
      description: >
        Legal Verifier assigned to the case only. Require a reason for both
        outcomes. The response records an in-app review acknowledgment; it is
        not represented as notarization or a legally qualified signature.
        APPROVED emits an outcome for Flow 6 but does not unlock assets.
      operationId: decideLegalVerificationCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /legal-verification-cases/{caseId}/events:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Legal Verification]
      summary: Get the case history
      description: Returns an attributable status timeline without document contents or private storage keys.
      operationId: listLegalVerificationEvents
      responses:
        '200':
          description: Case history returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      description: UUID of the legal-verification case
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      description: UUID of a document belonging to this case
      schema:
        type: string
        format: uuid

  schemas:
    CreateCaseRequest:
      type: object
      required: [handoverCaseId, assignmentId, beneficiaryContactId]
      properties:
        handoverCaseId:
          type: string
          format: uuid
          description: ID of the existing handover_cases record created after the DMS is triggered.
          example: 983a0732-d8a4-44c4-a363-099e030d7fa9
        assignmentId:
          type: string
          format: uuid
          description: Existing asset assignment being requested by the beneficiary.
          example: e09e8d87-fc26-45cd-92c3-d5c39e64dfee
        beneficiaryContactId:
          type: string
          format: uuid
          description: Existing beneficiary contact linked to the assignment.
          example: d70d1eac-3998-4ed9-a69a-577be98bc550

    UploadDocumentRequest:
      type: object
      required: [documentType, file]
      properties:
        documentType:
          $ref: '#/components/schemas/DocumentType'
        file:
          type: string
          format: binary
          description: PDF, JPEG, or PNG file, up to 10 MB per file in this prototype draft.

    RequestInformationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Specific information or document needed from the executor.
          example: Please upload a clearer copy of the death certificate.
        requestedDocumentTypes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'

    DecisionRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Human review rationale. This is not a legal opinion generated by the system.
          example: Submitted evidence reviewed for this platform workflow.

    CaseStatus:
      type: string
      enum: [DRAFT, SUBMITTED, IN_REVIEW, NEEDS_INFORMATION, APPROVED, REJECTED]

    DocumentType:
      type: string
      enum:
        - DEATH_CERTIFICATE
        - WILL
        - INHERITANCE_EVIDENCE
        - REPRESENTATIVE_AUTHORITY
        - IDENTITY_DOCUMENT
        - OTHER

    CaseListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        meta:
          type: object
          required: [page, size, total]
          properties:
            page:
              type: integer
              minimum: 0
            size:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0

    CaseSummary:
      type: object
      required: [caseId, handoverCaseId, assignmentId, beneficiaryContactId, status, executorUserId, createdAt, updatedAt]
      properties:
        caseId:
          type: string
          format: uuid
        handoverCaseId:
          type: string
          format: uuid
        assignmentId:
          type: string
          format: uuid
        beneficiaryContactId:
          type: string
          format: uuid
        subjectDisplayName:
          type: string
          nullable: true
          readOnly: true
          description: Minimal display information resolved from trusted server-side records.
        executorUserId:
          type: string
          format: uuid
          readOnly: true
        reviewerUserId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        status:
          $ref: '#/components/schemas/CaseStatus'
        submittedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LegalVerificationCase:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          properties:
            decision:
              type: object
              allOf:
                - $ref: '#/components/schemas/CaseDecision'
              nullable: true
            documents:
              type: array
              items:
                $ref: '#/components/schemas/CaseDocument'

    CaseDecision:
      type: object
      required: [outcome, reason, decidedByUserId, decidedAt, attestationType]
      properties:
        outcome:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string
        decidedByUserId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        attestationType:
          type: string
          enum: [IN_APP_REVIEW_ACKNOWLEDGEMENT]
          description: Internal platform acknowledgment, not a notarial act or qualified digital signature.

    CaseDocument:
      type: object
      required: [documentId, documentType, fileName, mediaType, sizeBytes, uploadedByUserId, uploadedAt]
      properties:
        documentId:
          type: string
          format: uuid
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
          description: Sanitized display filename; never a storage path.
        mediaType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        uploadedByUserId:
          type: string
          format: uuid
          readOnly: true
        uploadedAt:
          type: string
          format: date-time

    CaseEvent:
      type: object
      required: [eventId, eventType, actorUserId, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - CASE_CREATED
            - DOCUMENT_UPLOADED
            - CASE_SUBMITTED
            - REVIEW_STARTED
            - INFORMATION_REQUESTED
            - CASE_RESUBMITTED
            - CASE_APPROVED
            - CASE_REJECTED
        actorUserId:
          type: string
          format: uuid
        fromStatus:
          type: string
          allOf:
            - $ref: '#/components/schemas/CaseStatus'
          nullable: true
        toStatus:
          type: string
          allOf:
            - $ref: '#/components/schemas/CaseStatus'
          nullable: true
        reason:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time

    CaseResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LegalVerificationCase'

    DocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CaseDocument'

    DocumentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseDocument'

    CaseEventListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseEvent'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: Invalid or incomplete request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user does not have the required case access or role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Case, handover, assignment, beneficiary, or document not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Duplicate case for the same handover/assignment/beneficiary or invalid status transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Uploaded file exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Uploaded file type is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Required evidence is missing or the request cannot be submitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrationUnavailable:
      description: The private document encryption key is missing or local encrypted storage is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
